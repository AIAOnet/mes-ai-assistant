name: epiroc

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  opc-certificates-init:
    build: .
    command: ["sh", "-c", "if [ ! -f /app/certs/opc/.initialized ]; then python -m opc.certificates && touch /app/certs/opc/.initialized; fi"]
    volumes:
      - opc-certs:/app/certs/opc
    restart: "no"
    logging: *default-logging

  mqtt-certificates-init:
    build: .
    command: ["sh", "-c", "if [ ! -f /app/certs/mqtt/.initialized ]; then python -m mqtt.certificates && touch /app/certs/mqtt/.initialized; fi"]
    volumes:
      - mqtt-certs:/app/certs/mqtt
    restart: "no"
    logging: *default-logging

  mqtt-credentials-init:
    image: eclipse-mosquitto:2.0
    entrypoint: ["/bin/sh", "-c"]
    command: ["if [ ! -s /mosquitto/auth/passwords ]; then mosquitto_passwd -b -c /mosquitto/auth/passwords mes-client \"$$MES_MQTT_PASSWORD\"; fi; chown 1883:1883 /mosquitto/auth/passwords; chmod 600 /mosquitto/auth/passwords"]
    environment:
      MES_MQTT_PASSWORD: "${MES_MQTT_PASSWORD:?Copy .env.example to .env and set MES_MQTT_PASSWORD}"
    volumes:
      - mqtt-auth:/mosquitto/auth
    restart: "no"
    logging: *default-logging

  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mes-sql-server
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MES_SQL_PASSWORD:-MesLearning_2026!}"
    ports:
      - "${MES_BIND_ADDRESS:-127.0.0.1}:1433:1433"
    volumes:
      - mes-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *default-logging

  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: mes-mqtt-broker
    ports:
      - "${MES_BIND_ADDRESS:-127.0.0.1}:8883:8883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-auth:/mosquitto/auth:ro
      - mqtt-certs:/mosquitto/certs:ro
    environment:
      MES_MQTT_PASSWORD: "${MES_MQTT_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 8883 --cafile /mosquitto/certs/mqtt-ca.crt --cert /mosquitto/certs/mqtt-client.crt --key /mosquitto/certs/mqtt-client.key -u mes-client -P \"$$MES_MQTT_PASSWORD\" -t factory/health -m healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      mqtt-certificates-init:
        condition: service_completed_successfully
      mqtt-credentials-init:
        condition: service_completed_successfully
    logging: *default-logging

  database-init:
    build: .
    container_name: mes-database-init
    command: ["python", "-m", "database.bootstrap"]
    env_file: .env
    environment:
      MES_SQL_CONNECTION: "SERVER=sql-server,1433;DATABASE=MesSimulator;UID=sa;PWD=${MES_SQL_PASSWORD}"
    depends_on:
      sql-server:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  dashboard:
    build: .
    container_name: mes-dashboard
    env_file: .env
    environment:
      MES_CONTAINERIZED: "1"
      MES_DASHBOARD_HOST: "0.0.0.0"
      MES_SQL_CONNECTION: "SERVER=sql-server,1433;DATABASE=MesSimulator;UID=sa;PWD=${MES_SQL_PASSWORD}"
      MES_MQTT_HOST: "mqtt-broker"
      MES_MQTT_PORT: "8883"
    ports:
      - "${MES_BIND_ADDRESS:-0.0.0.0}:8000:8000"
    volumes:
      - opc-certs:/app/certs/opc:ro
      - mqtt-certs:/app/certs/mqtt:ro
      - ./config:/app/config
      - mes-rag-data:/app/rag_data
    depends_on:
      opc-certificates-init:
        condition: service_completed_successfully
      database-init:
        condition: service_completed_successfully
      mqtt-broker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *default-logging

volumes:
  mes-sql-data:
  mes-rag-data:
  opc-certs:
  mqtt-certs:
  mqtt-auth:
